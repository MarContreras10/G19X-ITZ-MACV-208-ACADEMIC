<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Conciliación bancaria{% endblock %}</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;margin:0;background:#f3f5f9;color:#1f2937}
  header{background:#1f3a5f;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  header a,header button{color:#fff;text-decoration:none}
  header form{display:inline;margin:0}
  header button{background:none;border:1px solid #fff8;border-radius:6px;padding:4px 12px;cursor:pointer;margin-left:12px}
  main{max-width:980px;margin:28px auto;padding:0 16px}
  main.wide{max-width:1500px}
  .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px #0002}
  .card h3{margin-top:0;color:#1f3a5f}
  .btn{display:inline-block;background:#1f3a5f;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;text-decoration:none}
  .btn:disabled{background:#9aa5b5;cursor:not-allowed}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label{display:block;font-size:13px;margin:10px 0 4px;color:#4b5563}
  input[type=date],input[type=file],input[type=text],input[type=password]{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:14px}
  .msg{padding:10px 14px;border-radius:6px;margin-bottom:12px;background:#dff5e1}
  .error{background:#fde0e0}
  .errorlist{color:#b42318;margin:4px 0;padding:0;list-style:none;font-size:13px}
  .muted{color:#6b7280;font-size:14px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  @media(max-width:720px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a href="{% url 'home' %}"><strong>Conciliación bancaria</strong></a>
  {% if user.is_authenticated %}
  <div>{{ user.get_username }}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Salir</button></form>
  </div>
  {% endif %}
</header>
<main class="{% block mainclass %}{% endblock %}">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
